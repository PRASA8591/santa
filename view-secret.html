<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa Assignments</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #11161d;
            color: #f1f5f9;
            min-height: 100vh;
            padding: 28px 18px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 720px;
        }

        .header {
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 14px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .table-card {
            background: #1a222d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 14px;
        }

        th {
            background: #232e3d;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .index-col {
            width: 55px;
            color: #94a3b8;
        }

        .arrow {
            color: #64748b;
            margin: 0 8px;
        }

        .receiver-badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.14);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
        }

        .pending-text {
            color: #94a3b8;
            font-style: italic;
            font-size: 13px;
        }

        @media (max-width: 540px) {
            th, td {
                padding: 11px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1>Secret Santa Gift List</h1>
            <p id="summary-text">Loading users and selections...</p>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th class="index-col">#</th>
                        <th>User</th>
                        <th>Gifts To</th>
                    </tr>
                </thead>
                <tbody id="pairs-tbody">
                    <tr>
                        <td colspan="3" style="text-align:center; color:#94a3b8;">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtSdOKaV6s-5ukKBt3DeQOcAsLAfpXUFA",
            authDomain: "fir-santa-54e5c.firebaseapp.com",
            projectId: "fir-santa-54e5c",
            storageBucket: "fir-santa-54e5c.firebasestorage.app",
            messagingSenderId: "274315972578",
            appId: "1:274315972578:web:5e8b4fc62cc011bfe1f3bb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const usersCol = collection(db, "users");
        const selectedCol = collection(db, "selected");

        const tbody = document.getElementById("pairs-tbody");
        const summaryText = document.getElementById("summary-text");

        let users = [];
        let selected = [];

        function renderOrderedList() {
            const selectedByGiverId = new Map();
            selected.forEach(item => {
                selectedByGiverId.set(item.giverId, item.receiverName);
            });

            const matchedCount = users.filter(u => selectedByGiverId.has(u.id)).length;
            summaryText.textContent = `Total Users: ${users.length} • Selected: ${matchedCount}/${users.length}`;

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">No users found in database.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            users.forEach((u, idx) => {
                const receiverName = selectedByGiverId.get(u.id);
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="index-col">${idx + 1}</td>
                    <td><strong>${u.name}</strong></td>
                    <td>
                        ${receiverName
                            ? `<span class="arrow">➔</span><span class="receiver-badge">${receiverName}</span>`
                            : `<span class="pending-text">Not selected yet</span>`
                        }
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        onSnapshot(query(usersCol, orderBy("name")), (snap) => {
            users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderOrderedList();
        });

        onSnapshot(selectedCol, (snap) => {
            selected = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderOrderedList();
        });
    </script>
</body>
</html>
